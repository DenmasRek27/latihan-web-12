<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 2 — Card Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <h1 class="text-2xl font-bold text-center mb-4">Katalog Produk</h1>

    <!-- Grid Layout Responsive: 1 kolom (default) -> 2 kolom (sm) -> 3 kolom (lg) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-5xl mx-auto">
        
        <!-- Kartu 1 -->
        <div class="bg-white p-4 rounded-lg shadow text-center">
            <div class="bg-gray-300 h-40 rounded flex items-center justify-center font-bold text-gray-600 mb-3">Gambar Produk 1</div>
            <h2 class="font-bold text-lg">Produk Satu</h2>
            <p class="text-gray-500 text-sm mb-3">Rp 10.000</p>
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full">Beli</button>
        </div>

        <!-- Kartu 2 -->
        <div class="bg-white p-4 rounded-lg shadow text-center">
            <div class="bg-gray-300 h-40 rounded flex items-center justify-center font-bold text-gray-600 mb-3">Gambar Produk 2</div>
            <h2 class="font-bold text-lg">Produk Dua</h2>
            <p class="text-gray-500 text-sm mb-3">Rp 20.000</p>
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full">Beli</button>
        </div>

        <!-- Kartu 3 -->
        <div class="bg-white p-4 rounded-lg shadow text-center">
            <div class="bg-gray-300 h-40 rounded flex items-center justify-center font-bold text-gray-600 mb-3">Gambar Produk 3</div>
            <h2 class="font-bold text-lg">Produk Tiga</h2>
            <p class="text-gray-500 text-sm mb-3">Rp 30.000</p>
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full">Beli</button>
        </div>

    </div>
</body>
</html>
